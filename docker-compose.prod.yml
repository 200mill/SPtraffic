name: sptraffic

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sptraffic
      POSTGRES_USER: sptraffic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sptraffic"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    image: ghcr.io/200mill/sptraffic-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sptraffic
      DB_USER: sptraffic
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_ADDR: redis:6379
      MIGRATIONS_DIR: /app/migrations
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - internal
      - external

  frontend:
    image: ghcr.io/200mill/sptraffic-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - external

networks:
  internal:
    internal: true
  external:
    driver: bridge

volumes:
  pgdata:
  redisdata:
