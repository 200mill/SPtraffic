name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sptraffic-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sptraffic-frontend

jobs:
  # ── Backend lint / test ───────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Tidy check
        working-directory: backend
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server ./cmd/server

      - name: Test
        working-directory: backend
        run: go test ./...

  # ── Frontend type-check / build ───────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Publish to GHCR ───────────────────────────────────────────────────────────
  # Runs only on push to master (not on PRs).
  # Images are public — set visibility at:
  #   github.com/200mill → Packages → sptraffic-backend / sptraffic-frontend → Package settings → Public
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend — extract metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Backend — build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend — extract metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Frontend — build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://192.168.219.113:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to server ──────────────────────────────────────────────────────────
  # Requires a self-hosted runner on the target server. Setup (once):
  #   github.com/200mill/SPtraffic → Settings → Actions → Runners → New self-hosted runner
  # Requires ~/sptraffic/.env on the server with DATAGOKR_API_KEY, DB_PASSWORD, ADMIN_KEY.
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp ~/sptraffic/.env .env

      - name: Deploy
        run: |
          docker rm -f sptraffic-backend-1 sptraffic-frontend-1 2>/dev/null || true
          docker compose -f docker-compose.prod.yml pull --quiet
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verify health
        run: |
          sleep 5
          curl -sf http://localhost:8080/health || \
            (docker compose -f docker-compose.prod.yml logs backend --tail 30 && exit 1)

      - name: Clean up old images
        run: docker image prune -f --filter "until=1h"
